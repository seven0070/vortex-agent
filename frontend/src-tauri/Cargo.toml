[package]
name = "vortex-agent"
version = "1.0.0"
description = "Vortex Agent - Autonomous Local-First AI Platform"
authors = ["Vortex Team"]
edition = "2021"

# Standalone workspace root — prevents Cargo from inheriting the broken
# C:\Users\sanath\Cargo.toml workspace (which references missing submodules).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.x with required features
tauri = { version = "2.0", default-features = false, features = ["tracing", "tray-icon", "wry"] }

# Tauri 2.x plugins (separate crates)
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (backend health check)
reqwest = { version = "0.12", features = ["blocking"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
